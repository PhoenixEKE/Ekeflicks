name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ekeflicks_test
          POSTGRES_USER: ekeflicks
          POSTGRES_PASSWORD: ekeflicks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekeflicks -d ekeflicks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      POSTGRES_DB: ekeflicks_test
      POSTGRES_USER: ekeflicks
      POSTGRES_PASSWORD: ekeflicks
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    defaults:
      run:
        working-directory: ekeflicks_backend/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for video analysis tests
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ekeflicks_backend/backend/requirements.lock.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run the backend test suite
        run: python manage.py test --settings=config.settings_test --verbosity=2

  flutter:
    name: Flutter tests (${{ matrix.application }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        application:
          - plateforme_client
          - plateforme_producteurs
          - plateforme_administrateur
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 for Android DRM plugin
        if: matrix.application == 'plateforme_client'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Accept Android SDK licenses
        if: matrix.application == 'plateforme_client'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Build producer web application
        if: matrix.application == 'plateforme_producteurs'
        run: flutter build web --release
      - name: Build client web application
        if: matrix.application == 'plateforme_client'
        run: flutter build web --release
      - name: Build client Android application
        if: matrix.application == 'plateforme_client'
        run: flutter build apk --release
      - name: Run Flutter tests
        run: flutter test

  client-ios-build:
    name: Client iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: plateforme_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator without code signing
        run: flutter build ios --debug --simulator --no-codesign
