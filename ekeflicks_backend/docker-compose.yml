services:

  django:
    image: ekeflicks_backend:latest

    build:
      context: .
      dockerfile: Dockerfile

    container_name: ekeflicks_django

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_started

    restart: always

    networks:
      - ekeflicks_network


  celery:
    image: ekeflicks_backend:latest

    container_name: ekeflicks_celery

    command: celery -A config worker -l info

    env_file:
      - .env

    volumes:
      - media_volume:/app/media

    depends_on:
      - redis
      - postgres

    restart: always

    networks:
      - ekeflicks_network


  celery-beat:
    image: ekeflicks_backend:latest

    container_name: ekeflicks_celery_beat

    command: celery -A config beat -l info

    env_file:
      - .env

    volumes:

      - media_volume:/app/media

    depends_on:
      - redis

    restart: always

    networks:
      - ekeflicks_network


  postgres:
    image: postgres:15-alpine

    container_name: ekeflicks_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5433:5432"

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ekeflicks_network


  redis:
    image: redis:7-alpine

    container_name: ekeflicks_redis

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    ports:
      - "127.0.0.1:6379:6379"

    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ekeflicks_network


  minio:
    image: minio/minio:latest

    container_name: ekeflicks_minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"

    volumes:
      - minio_data:/data

    restart: always

    networks:
      - ekeflicks_network


  clickhouse:
    image: clickhouse/clickhouse-server:23.8

    container_name: ekeflicks_clickhouse

    environment:
      CLICKHOUSE_DB: ekeflicks
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9009:9009"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

    restart: always

    networks:
      - ekeflicks_network


  neo4j:
    image: neo4j:5.26-community

    container_name: ekeflicks_neo4j

    profiles:
      - neo4j

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-change-me} 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: always

    networks:
      - ekeflicks_network


volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
  neo4j_data:
  neo4j_logs:
  static_volume:
  media_volume:


networks:
  ekeflicks_network:
    driver: bridge
